<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 4: Temple of Dendur</title>
    <link rel="stylesheet" href="main.css?v=6">
</head>
<body>
    <main class="page">
        <header class="header">
            <h1>Conrad Brousseau</h1>
            <p>Core 1 Interactions · Fall 2026</p>
            <p>Project 4: Temple of Dendur CSS Recreation</p>
            <p>The Temple of Dendur at The Metropolitan Museum of Art</p>
        </header>

        <section class="scene" aria-label="CSS drawing of the Temple of Dendur">
            <div class="temple">
                <div class="roof"></div>
                <div class="wall"></div>
                <div class="entrance">
                    <a class="columns-link" href="columns.html" aria-label="Explore the temple columns">
                        <span class="column">
                            <span class="capital"></span>
                            <span class="shaft"></span>
                        </span>
                        <span class="column">
                            <span class="capital"></span>
                            <span class="shaft"></span>
                        </span>
                    </a>
                </div>
                <div class="wall"></div>
            </div>

            <a class="arch" href="arch.html" aria-label="Explore the temple arch">
                <div class="arch-top"></div>
                <div class="arch-leg left"></div>
                <div class="arch-leg right"></div>
                <div class="circle"></div>
            </a>

            <div class="water" role="img" aria-label="Blue water inspired by the reflecting pool near the Temple of Dendur at The Met"></div>
        </section>

        <nav class="detail-links" aria-label="Explore temple details">
            <a href="arch.html">Explore the arch <span aria-hidden="true">→</span></a>
            <a href="columns.html">Explore the columns <span aria-hidden="true">→</span></a>
        </nav>
    </main>

</body>
</html>
